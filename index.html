<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year Progress</title>
  <style>
    /* Global & Layout Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outer Wrapper with Vertical Offset (-55px as specified in Dart code) */
    .container-wrapper {
      transform: translateY(-55px);
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: center;
    }

    /* Main Card / Container Structure */
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 1. Year Header */
    .year-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 10px; /* gapYearToDate */
    }

    /* 2. Date Text (e.g., Tuesday, 13 September) */
    .date-text {
      font-size: 16px; /* fontSizeDate */
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 14px; /* gapDateToProgress */
    }

    /* 3. Progress Bar Container */
    .progress-bar {
      width: 100%;
      height: 24px; /* minHeight: 24 */
      background-color: #2E2E2E; /* Empty state color */
      border-radius: 12px; /* ClipRRect borderRadius: 12 */
      overflow: hidden;
      position: relative;
      margin-bottom: 14px; /* gapProgressToDay */
    }

    /* Progress Fill */
    .progress-fill {
      height: 100%;
      background-color: #61A71D; /* Progressbar filled color */
      width: 0%;
      transition: width 0.4s ease-out;
    }

    /* Percentage Label Inside Bar */
    .percentage-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.875rem;
      font-weight: bold;
      color: #FFFFFF;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 4. Day Text (e.g., Day 167) */
    .day-text {
      font-size: 16px; /* fontSizeDay */
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 10px; /* gapDayToRemaining */
    }

    /* 5. Days Remaining Text */
    .remaining-text {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7); /* Secondary Text Color */
    }

    .remaining-text strong {
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
    }

    .remaining-text span {
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container-wrapper">
    <div class="container">
      <!-- Year -->
      <h1 class="year-title" id="year-title"></h1>

      <!-- Date (Weekday, Day Month) -->
      <div class="date-text" id="date-part"></div>

      <!-- Progress Bar with Centered Percentage -->
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="percentage-text" id="percentage-text">0%</div>
      </div>

      <!-- Current Day of Year -->
      <div class="day-text" id="day-part"></div>

      <!-- Remaining Days -->
      <div class="remaining-text">
        <strong id="remaining-count"></strong>
        <span id="remaining-label"></span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();

      // Check Leap Year logic matching Dart code
      const year = now.getFullYear();
      const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
      const daysInYear = isLeapYear ? 366 : 365;

      // Calculate exact day of year (using local date boundaries)
      const startOfYear = new Date(year, 0, 1);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dayOfYear = Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
      const daysPassed = dayOfYear - 1;

      // Percentage calculation matching Dart logic
      const percentage = (daysPassed / daysInYear) * 100;
      const roundedPercentage = Math.round(percentage);
      const progressValue = roundedPercentage === 50 ? 50 : percentage;

      // Date Formatting Arrays
      const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const weekdayStr = weekdays[now.getDay()];
      const dayOfMonth = now.getDate();
      const monthStr = months[now.getMonth()];

      const remainingDays = daysInYear - dayOfYear;

      // DOM Updates
      document.getElementById('year-title').textContent = year;
      document.getElementById('date-part').textContent = `${weekdayStr}, ${dayOfMonth} ${monthStr}`;
      document.getElementById('progress-fill').style.width = `${progressValue}%`;
      document.getElementById('percentage-text').textContent = `${roundedPercentage}%`;
      document.getElementById('day-part').textContent = `Day ${dayOfYear}`;
      document.getElementById('remaining-count').textContent = `${remainingDays} `;
      document.getElementById('remaining-label').textContent = remainingDays === 1 ? 'day remaining' : 'Days Remaining';
    });
  </script>
</body>
</html>
